name: Compose simulation
on: [push, pull_request, workflow_dispatch]
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.nvidia.yaml --profile ai --profile gui config --quiet
      - name: Build ROS image
        run: docker compose build
      - name: Start software-rendered simulation
        run: docker compose up -d gazebo platform battery vlm reasoning
      - name: Check sensors, motion and AI transport
        run: docker compose run --rm --no-deps platform python3 /ws/src/minibot/tests/ros_smoke.py
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
